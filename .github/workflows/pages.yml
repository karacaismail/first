# Siteyi derler ve GitHub Pages'te yayınlar.
# Adres: https://karacaismail.github.io/first/
name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: ilk-ilkeler

jobs:
  build:
    name: Derle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ilk-ilkeler/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Çevirileri siteye aktar
        run: npm run content

      - name: Siteyi derle
        run: npm run build

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ilk-ilkeler/dist

  deploy:
    name: Yayınla
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
